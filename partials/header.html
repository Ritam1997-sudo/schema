<header class="site">
  <div class="wrap">
    <div class="header-top">
      <a class="brand" href="https://papaycheckcalculator.com/" aria-label="PA Paycheck Calculator Home">
        <img class="brand-logo-img" src="https://papaycheckcalculator.com/logo.avif" alt="PA Paycheck Calculator" width="220" height="60">
      </a>
      <div class="header-right">
        <span class="version-badge" title="2026 tax year — updated August 2026">2026 Tax Year</span>
        <div class="live-clock">
          <span class="dot-live"></span>
          <span class="updated-lbl">Live</span>
          <span id="liveClock">—</span>
        </div>
      </div>
    </div>
  </div>

  <div id="nav-placeholder"></div>

  <div class="weather-strip" id="weatherStrip">
    <div class="wrap weather-inner">
      <div class="weather-loc">
        <span class="dot"></span>
        <span id="wxCityName">Pennsylvania</span>
        <span class="wx-live">LIVE</span>
      </div>
      <div class="weather-current" id="wxCurrent">
        <span class="wx-icon" id="wxIcon">—</span>
        <span class="wx-temp" id="wxTemp">--°</span>
        <span class="wx-desc" id="wxDesc">Loading…</span>
      </div>
      <div class="weather-forecast" id="wxForecast"></div>
    </div>
  </div>
</header>
